[project]
name = "sandbox-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "scipy>=1.14",
  "pyarrow>=17",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
